<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="0.55" stop-color="#1b1446"/>
      <stop offset="1" stop-color="#3a1352"/>
    </linearGradient>
    <linearGradient id="bid" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0.15"/>
